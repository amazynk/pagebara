[package]
name = "pagebara-jpeg"
description = "JPEG decoder: baseline, progressive, arithmetic, lossless, hierarchical; DCT-scaled, region and parallel decode"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pagebara-budget.workspace = true
pagebara-thread = { workspace = true, features = ["rayon"] }
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Test oracle for Huffman lossless (SOF3) frames, which are decoded natively.
jpeg-decoder = { version = "0.3", default-features = false }
zune-jpeg = "0.5"
zune-core = "0.5"
jpeg-encoder = "0.7"
# Tests install a minimal collector (`tests/tracing.rs`); the library never does.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints]
workspace = true
