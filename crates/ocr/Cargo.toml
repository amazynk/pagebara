[package]
name = "pagebara-ocr"
description = "OCR for scanned pages: text recognition and an invisible, searchable text layer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pagebara-syntax.workspace = true
pagebara-pages.workspace = true
pagebara-content.workspace = true
pagebara-render.workspace = true
pagebara-font.workspace = true
miniz_oxide.workspace = true
rayon.workspace = true
pagebara-thread = { workspace = true, features = ["rayon"] }
sha2.workspace = true
thiserror.workspace = true
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
rten-tensor = "0.28"
ureq = { version = "3.5", optional = true, default-features = false, features = ["rustls"] }

[features]
# HttpFetch: model downloads over HTTPS (ureq with rustls/ring).
download = ["dep:ureq"]

[lints]
workspace = true
