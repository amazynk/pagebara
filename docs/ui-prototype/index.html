<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagebara · UI prototype</title>
<style>
@font-face {
  font-family: "Inter Proto";
  src: url("../../apps/desktop/ui/fonts/InterVariable.ttf") format("truetype");
  font-weight: 100 900;
}
:root {
  --desk: #E7E1D7;
  /* Current: the light set of crates/app-core/src/theme.rs */
  --c-text: #18181B; --c-muted: #52525B; --c-faint: #6B6B73; --c-border: #E4E4E7;
  --c-control-border: #8A8A93; --c-chrome: #FFFFFF; --c-canvas: #F1F1F3; --c-track: #F1F1F3;
  --c-raised: #FFFFFF; --c-hover: #F4F4F5; --c-pressed: #E4E4E7; --c-accent: #2563EB;
  --c-accent-soft: #EAF1FF; --c-accent-fg: #2563EB; --c-danger: #B91C1C;
  --c-titlebar: #E8E8EA; --c-tabbar: #EFEFF1;
  /* Proposed */
  --n-chrome: #F6F6F7;
  --n-canvas: #E6E6EA;
  --n-surface: #FFFFFF;
  --n-line: rgba(24, 24, 27, .085);
  --n-line-strong: rgba(24, 24, 27, .14);
  --n-text: #18181B; --n-muted: #5F5F6A; --n-faint: #8C8C97;
  --n-hover: rgba(24, 24, 27, .055); --n-press: rgba(24, 24, 27, .09);
  --n-accent: #2563EB; --n-accent-fg: #2563EB; --n-accent-soft: rgba(37, 99, 235, .11);
  --n-danger: #DC2626; --n-danger-soft: rgba(220, 38, 38, .09);
  --n-shadow-pill: 0 0 0 .5px rgba(24, 24, 27, .12), 0 2px 4px rgba(24, 24, 27, .04), 0 8px 24px rgba(24, 24, 27, .10);
  /* Two crisp steps, as page-view.slint draws its shadow: no blur to paint while scrolling. */
  --n-shadow-page: 0 1px 0 1px rgba(24, 24, 27, .13), 0 3px 0 2px rgba(24, 24, 27, .05);
  --n-shadow-pop: 0 0 0 .5px rgba(24, 24, 27, .14), 0 12px 40px rgba(24, 24, 27, .18);
}
html[data-theme="dark"] {
  --desk: #2A2724;
  --c-text: #F4F4F5; --c-muted: #A1A1AA; --c-faint: #8B8B94; --c-border: #2E2E33;
  --c-control-border: #76767F; --c-chrome: #1E1E21; --c-canvas: #141416; --c-track: #2A2A2E;
  --c-raised: #3A3A40; --c-hover: #2A2A2E; --c-pressed: #34343A; --c-accent: #2563EB;
  --c-accent-soft: #1E3157; --c-accent-fg: #60A5FA; --c-danger: #F87171;
  --c-titlebar: #2B2B2E; --c-tabbar: #19191B;
  --n-chrome: #1B1B1E; --n-canvas: #0F0F11; --n-surface: #26262A;
  --n-line: rgba(255, 255, 255, .075); --n-line-strong: rgba(255, 255, 255, .13);
  --n-text: #F2F2F3; --n-muted: #A6A6B0; --n-faint: #74747E;
  --n-hover: rgba(255, 255, 255, .06); --n-press: rgba(255, 255, 255, .1);
  --n-accent: #3B82F6; --n-accent-fg: #7AAEFF; --n-accent-soft: rgba(59, 130, 246, .2);
  --n-danger: #F87171; --n-danger-soft: rgba(248, 113, 113, .12);
  --n-shadow-pill: 0 0 0 .5px rgba(255, 255, 255, .12), 0 8px 24px rgba(0, 0, 0, .45);
  --n-shadow-page: 0 1px 0 1px rgba(0, 0, 0, .55), 0 3px 0 2px rgba(0, 0, 0, .3);
  --n-shadow-pop: 0 0 0 .5px rgba(255, 255, 255, .12), 0 16px 48px rgba(0, 0, 0, .6);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font: 13px/1.35 "Inter Proto", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--desk); overflow: hidden; -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: default; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:disabled { opacity: .38; }
input { outline: none; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.caret { width: 12px; height: 12px; margin-left: -3px; opacity: .55; stroke-width: 2.2; }
[hidden] { display: none !important; }
kbd { font: 500 11px/1 "Inter Proto", system-ui, sans-serif; }

/* ---------- Prototype chrome (not part of the app) ---------- */
.proto {
  position: fixed; inset: 0 0 auto 0; height: 48px; z-index: 50;
  display: flex; align-items: center; gap: 18px; padding: 0 20px;
  background: #121214; color: #D4D4D8; font-size: 12px;
}
.proto b { color: #fff; font-weight: 650; font-size: 13px; }
.proto .lbl { color: #71717A; }
.proto .grp { display: flex; align-items: center; gap: 8px; }
.proto .sp { flex: 1; }
.proto { white-space: nowrap; }
.proto .hint { color: #71717A; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pseg { display: flex; background: #27272A; border-radius: 8px; padding: 2px; }
.pseg button { height: 26px; padding: 0 12px; border-radius: 6px; color: #A1A1AA; font-weight: 500; }
.pseg button.on { background: #3F3F46; color: #fff; }
.proto label { display: flex; align-items: center; gap: 6px; }
.stage { position: fixed; inset: 48px 0 0 0; display: flex; gap: 20px; padding: 20px; }
.frame { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; }
.win {
  position: relative; width: 100%; height: 100%; border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column; isolation: isolate;
  box-shadow: 0 0 0 .5px rgba(0, 0, 0, .35), 0 24px 70px rgba(0, 0, 0, .28);
}
.win { container: win / inline-size; }
.frame[data-size="1280"] .win { width: min(1280px, 100%); height: min(820px, 100%); }
.frame[data-size="960"] .win { width: min(960px, 100%); height: min(640px, 100%); }
.lights { display: flex; gap: 8px; flex: none; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .15); }
.lights i:nth-child(2) { background: #FEBC2E; }
.lights i:nth-child(3) { background: #28C840; }

.notes {
  width: 344px; flex: none; overflow: auto; border-radius: 12px; padding: 18px 14px 18px 18px;
  background: #FFFDF8; color: #18181B; box-shadow: 0 0 0 .5px rgba(0, 0, 0, .15), 0 12px 40px rgba(0, 0, 0, .12);
}
html[data-theme="dark"] .notes { background: #1D1D20; color: #E4E4E7; }
.notes h2 { font-size: 16px; font-weight: 650; margin-bottom: 4px; }
.notes .lead { font-size: 12.5px; color: #71717A; line-height: 1.5; margin-bottom: 12px; }
.notes h5 { font-size: 12px; font-weight: 650; margin: 16px 0 6px; color: #71717A; }
.notes ul { font-size: 12.5px; line-height: 1.5; color: #52525B; padding-left: 16px; }
html[data-theme="dark"] .notes ul { color: #A1A1AA; }
.note { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 9px 8px; border-radius: 8px; }
.note.on { background: rgba(239, 68, 68, .09); }
.note.g.on { background: rgba(22, 163, 74, .1); }
.note h3 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.note p { font-size: 12.5px; color: #5B5B66; line-height: 1.48; }
html[data-theme="dark"] .note p { color: #A1A1AA; }
.num, .pin {
  width: 20px; height: 20px; border-radius: 50%; background: #EF4444; color: #fff;
  font: 700 11px/20px "Inter Proto", system-ui, sans-serif; text-align: center;
}
.num.g, .pin.g { background: #16A34A; }
.pins { position: absolute; inset: 0; pointer-events: none; z-index: 45; }
.pin { position: absolute; pointer-events: auto; cursor: help; box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(0, 0, 0, .35); transition: transform .12s; }
.pin.on { transform: scale(1.3); }
.mark-on { outline: 2px solid #EF4444 !important; outline-offset: -2px; }
.mark-on.g-mark { outline-color: #16A34A !important; }

.tip {
  position: fixed; z-index: 100; pointer-events: none; display: flex; gap: 8px; align-items: center;
  background: #18181B; color: #fff; font-size: 12px; padding: 5px 8px; border-radius: 7px; white-space: nowrap;
  box-shadow: 0 0 0 .5px rgba(255, 255, 255, .1), 0 4px 14px rgba(0, 0, 0, .25);
}
.tip kbd { color: #A1A1AA; }

/* ---------- Current UI (a copy of the Slint UI) ---------- */
.cur { background: var(--c-chrome); color: var(--c-text); }
.c-titlebar { height: 28px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--c-titlebar); }
.c-wtitle { font-weight: 600; font-size: 13px; color: var(--c-muted); }
.c-tabs { height: 34px; flex: none; display: flex; align-items: flex-end; gap: 4px; padding: 0 8px; background: var(--c-tabbar); }
.c-tab { width: 124px; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 12px; border-radius: 8px 8px 0 0; color: var(--c-muted); }
.c-tab.on { background: var(--c-chrome); color: var(--c-text); font-weight: 600; }
.c-tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-accent); flex: none; }
.c-tab .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.c-tab button { width: 22px; height: 22px; border-radius: 5px; }
.c-tab button svg { width: 14px; height: 14px; }
.c-tabs > .c-ib { width: 28px; height: 28px; margin-bottom: 1px; }
.c-toolbar { height: 52px; flex: none; position: relative; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid var(--c-border); background: var(--c-chrome); }
.c-start { display: flex; align-items: center; gap: 8px; min-width: 0; }
.c-ib { width: 32px; height: 32px; border-radius: 6px; color: var(--c-text); flex: none; }
.c-ib:hover:not(:disabled) { background: var(--c-hover); }
.c-ib.checked { background: var(--c-accent-soft); color: var(--c-accent-fg); }
.c-title { min-width: 0; max-width: 240px; }
.c-title b { display: block; font-size: 14px; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-title span { display: block; font-size: 12px; color: var(--c-muted); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-seg-tools { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 2px; padding: 3px; background: var(--c-track); border-radius: 8px; }
.c-seg-tools button { width: 36px; height: 28px; border-radius: 6px; }
.c-seg-tools button.on { background: var(--c-raised); box-shadow: 0 1px 2px rgba(0, 0, 0, .14), 0 0 0 .5px rgba(0, 0, 0, .06); }
.c-end { display: flex; align-items: center; gap: 2px; }
.c-div { width: 9px; height: 20px; display: flex; justify-content: center; }
.c-div::before { content: ""; width: 1px; background: var(--c-border); }
.c-zoom { width: 56px; height: 32px; border-radius: 6px; font-weight: 500; }
.c-zoom:hover { background: var(--c-hover); }
.c-save { height: 32px; padding: 0 14px; margin-left: 6px; border-radius: 6px; background: var(--c-accent); color: #fff; font-weight: 500; }
/* As toolbar.slint does it: labels on the tools from 1560px; below about 920px the theme button
   goes, then read aloud, then the title, then the zoom buttons. */
.c-seg-tools .lbl { display: none; }
@container win (min-width: 1560px) {
  .c-seg-tools button { width: auto; padding: 0 10px; gap: 6px; }
  .c-seg-tools .lbl { display: inline; }
}
@container win (max-width: 921px) { .c-x-theme { display: none !important; } }
@container win (max-width: 887px) { .c-x-read { display: none !important; } }
@container win (max-width: 853px) { .c-title { display: none !important; } }
@container win (max-width: 745px) { .c-x-zoom { display: none !important; } }
.c-body { flex: 1; display: flex; min-height: 0; }
.c-sidebar { width: 232px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--c-border); background: var(--c-chrome); }
.c-seg { display: flex; padding: 3px; background: var(--c-track); border-radius: 8px; }
.c-sidebar > .c-seg { margin: 12px 12px 6px; }
.c-seg button { flex: 1; height: 28px; padding: 0 6px; border-radius: 6px; color: var(--c-muted); }
.c-seg button.on { background: var(--c-raised); color: var(--c-text); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.c-seg button svg { width: 16px; height: 16px; }
.c-sidebody { flex: 1; overflow-y: scroll; position: relative; }
.c-thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 4px; padding: 6px 4px 12px 8px; }
.c-thumb { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.c-thumb img { width: 88px; height: 114px; border: 1px solid var(--c-border); background: #fff; display: block; }
.c-thumb.on img { outline: 2px solid var(--c-accent); outline-offset: 2px; }
.c-thumb span { color: var(--c-muted); }
.c-thumb.on span { color: var(--c-accent-fg); font-weight: 600; }
.c-list { padding: 4px 12px; display: flex; flex-direction: column; gap: 2px; }
.c-list button { height: 32px; justify-content: space-between; padding: 0 8px; border-radius: 6px; }
.c-list button:hover { background: var(--c-hover); }
.c-list .pg { color: var(--c-muted); }
.c-card { margin: 4px 12px; padding: 10px; border: 1px solid var(--c-border); border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
.c-card .top { display: flex; justify-content: space-between; color: var(--c-muted); font-size: 12px; }
.c-canvas { flex: 1; min-width: 0; overflow: auto; background: var(--c-canvas); }
.c-pages { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px; min-width: fit-content; }
.c-page, .n-page { position: relative; background: #fff; flex: none; }
/* page-view.slint: a 1px and a 2px step, 11% and 5%. */
.c-page { box-shadow: 0 1px 0 1px rgba(24, 24, 27, .11), 0 3px 0 2px rgba(24, 24, 27, .05); }
.c-page img, .n-page img { width: 100%; height: 100%; display: block; user-select: none; }
.c-tbox { position: absolute; padding: calc(3px * var(--s)) calc(5px * var(--s)); font-family: Helvetica, Arial, sans-serif; line-height: 1.05; color: #18181B; }
.c-tbox.sel { outline: 1.5px solid var(--c-accent); }
.c-tbox .h { position: absolute; width: 7px; height: 7px; background: #fff; border: 1.5px solid var(--c-accent); }
.c-tbox .tl { left: -4px; top: -4px; } .c-tbox .tr { right: -4px; top: -4px; }
.c-tbox .bl { left: -4px; bottom: -4px; } .c-tbox .br { right: -4px; bottom: -4px; }
.c-panel { width: 300px; flex: none; border-left: 1px solid var(--c-border); background: var(--c-chrome); padding: 0 16px 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.c-ph { display: flex; align-items: center; justify-content: space-between; height: 46px; margin-bottom: -2px; flex: none; }
.c-ph h2 { font-size: 17px; font-weight: 600; }
.c-ph .c-ib svg { width: 16px; height: 16px; }
.c-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.c-muted { color: var(--c-muted); }
.c-swatches { display: flex; justify-content: space-between; padding: 0 2px 0 6px; }
.c-sw { width: 22px; height: 22px; border-radius: 50%; }
.c-sw.on { box-shadow: 0 0 0 2px var(--c-chrome), 0 0 0 4px var(--c-accent); }
.c-slider { position: relative; height: 18px; margin: 0 0 0 6px; }
.c-slider .tr { position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--c-pressed); }
.c-slider .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--c-accent); }
.c-slider .kn { position: absolute; top: 0; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--c-accent); box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--c-border); }
.c-hr { height: 1px; background: var(--c-border); flex: none; }
.c-textarea { min-height: 64px; border: 1px solid var(--c-border); border-radius: 6px; padding: 7px 8px; }
.c-input { height: 36px; border: 1px solid var(--c-control-border); border-radius: 6px; padding: 0 10px; display: flex; align-items: center; color: var(--c-faint); flex: none; }
.c-btn { height: 32px; padding: 0 12px; border: 1px solid var(--c-border); border-radius: 6px; background: var(--c-raised); flex: none; }
.c-btn.wide { width: 100%; }
.c-btn svg { width: 16px; height: 16px; }
.c-hint { color: var(--c-muted); line-height: 1.5; }
.c-check { display: flex; align-items: center; gap: 10px; }
.c-check i { width: 18px; height: 18px; border-radius: 4px; background: var(--c-accent); display: grid; place-items: center; color: #fff; }
.c-check i svg { width: 13px; height: 13px; stroke-width: 3; }
.c-seg.labelled button { flex-direction: column; gap: 1px; height: 44px; font-size: 11px; padding: 0 2px; }
.c-status { height: 30px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-top: 1px solid var(--c-border); background: var(--c-chrome); }
.c-status .c-ib { width: 24px; height: 24px; }
.c-status .c-ib svg { width: 16px; height: 16px; }
.c-pagefield { min-width: 28px; height: 22px; padding: 0 8px; border-radius: 5px; background: var(--c-track); display: grid; place-items: center; }
.c-sep { width: 1px; height: 14px; background: var(--c-border); margin: 0 4px; }
.c-menu { position: absolute; z-index: 30; width: 260px; max-height: calc(100% - 100px); overflow: auto; padding: 5px; border-radius: 8px; background: var(--c-raised); box-shadow: 0 0 0 1px var(--c-border), 0 8px 24px rgba(0, 0, 0, .16); }
.c-mi { width: 100%; height: 32px; justify-content: flex-start; gap: 10px; padding: 0 10px; border-radius: 6px; }
.c-mi:hover { background: var(--c-hover); }
.c-mi svg { width: 16px; height: 16px; }
.c-mi .k { margin-left: auto; color: var(--c-faint); font-size: 12px; }
.c-mdiv { height: 1px; background: var(--c-border); margin: 4px 6px; }

/* ---------- Proposed UI ---------- */
.nw { background: var(--n-chrome); color: var(--n-text); }
.n-strip { height: 40px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 16px; }
.n-strip .lights { margin-right: 14px; }
.n-tabs { display: flex; gap: 4px; min-width: 0; flex: 0 1 auto; }
.n-tab { height: 30px; width: 200px; min-width: 90px; flex: 0 1 200px; display: flex; align-items: center; gap: 8px; padding: 0 5px 0 12px; border-radius: 8px; color: var(--n-muted); }
.n-tab:hover { background: var(--n-hover); }
.n-tab.on { background: var(--n-surface); color: var(--n-text); box-shadow: 0 0 0 .5px var(--n-line-strong), 0 1px 2px rgba(0, 0, 0, .05); }
.n-tab .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.n-tab .ed { width: 6px; height: 6px; border-radius: 50%; background: var(--n-faint); flex: none; }
.n-tab .cl { width: 20px; height: 20px; border-radius: 5px; opacity: 0; flex: none; }
.n-tab .cl svg { width: 13px; height: 13px; }
.n-tab:hover .cl, .n-tab.on .cl, .n-tab .cl.dirty { opacity: 1; }
/* Unsaved changes: a dot where the close button goes, as macOS does; the × on hover. */
.n-tab .cl.dirty svg { display: none; }
.n-tab .cl.dirty::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--n-muted); }
.n-tab:hover .cl.dirty svg { display: block; }
.n-tab:hover .cl.dirty::before { display: none; }
.n-tab .cl:hover { background: var(--n-hover); }
.n-top {
  height: 52px; flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center; gap: 12px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--n-line);
}
.n-strip:not([hidden]) + .n-top { height: 48px; }
.n-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
.n-left .lights { margin-right: 16px; }
.n-right { display: flex; align-items: center; gap: 6px; justify-self: end; }
.n-ib { width: 32px; height: 32px; border-radius: 8px; color: var(--n-muted); flex: none; }
.n-ib:hover:not(:disabled) { background: var(--n-hover); color: var(--n-text); }
.n-ib.sm { width: 28px; height: 28px; }
.n-ib.sm svg { width: 16px; height: 16px; }
.n-doc { height: 32px; padding: 0 6px 0 8px; border-radius: 8px; gap: 6px; min-width: 0; }
.n-doc:hover { background: var(--n-hover); }
.n-doc .nm { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n-doc .ed { color: var(--n-faint); white-space: nowrap; }
.n-doc .ed::before { content: "— "; }
.n-doc svg { width: 14px; height: 14px; color: var(--n-faint); }
.n-modes { display: flex; padding: 3px; gap: 2px; background: var(--n-hover); border-radius: 10px; }
.n-modes button { height: 28px; padding: 0 13px; border-radius: 7px; color: var(--n-muted); font-weight: 500; white-space: nowrap; }
.n-modes button:hover { color: var(--n-text); }

function placePins() {
  $$(".pins").forEach(p => { p.innerHTML = ""; });
  if (!P.notes) return;
  const win = P.ver === "cur" ? $("#cur") : $("#nw");
  const wr = win.getBoundingClientRect();
  const layer = $(".pins", win);
  noteList().forEach((n, i) => {
    const el = $(n.sel, win);
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height || r.left >= wr.right - 4 || r.right <= wr.left + 4) return;
    // Clip to the visible part of the element's scroll box.
    const box = el.closest(".c-canvas, .n-scroll, .c-sidebody, .n-sidebody");
    const br = box && !box.contains(el) ? null : box ? box.getBoundingClientRect() : wr;
    // The pin's centre: a corner or edge of the element ("tl", "tr", "bl", "br", "tc", "bc"), moved by dx, dy.
    const at = n.at || "tl";
    const ax = at.endsWith("l") ? r.left : at.endsWith("r") ? r.right : r.left + r.width / 2;
    const ay = at.startsWith("t") ? r.top : r.bottom;
    let x = ax - wr.left + n.dx - 10, y = ay - wr.top + n.dy - 10;
    const minY = (br ? br.top : wr.top) - wr.top, maxY = (br ? br.bottom : wr.bottom) - wr.top;
    if (y + 10 < minY - 2 || y + 10 > maxY + 2) return;
    x = clamp(x, 4, wr.width - 24); y = clamp(y, 4, wr.height - 24);
    const pin = document.createElement("span");
    pin.className = "pin" + (P.ver === "cur" ? "" : " g");
    pin.textContent = noteNum(i);
    pin.dataset.n = i;
    pin.style.left = x + "px"; pin.style.top = y + "px";
    pin.addEventListener("mouseenter", () => { markNote(i); const n2 = $(`.note[data-n="${i}"]`); if (n2) n2.scrollIntoView({ block: "nearest", behavior: "smooth" }); });

}

let openPop = null;

function pop(anchor, html, { place = "below", cls = "", onPick } = {}) {
  closePop();
  const win = anchor.closest(".win");
  const p = document.createElement("div");
  p.className = "pop " + cls;
  p.innerHTML = html;
  win.appendChild(p);
  const wr = win.getBoundingClientRect(), ar = anchor.getBoundingClientRect(), pr = p.getBoundingClientRect();
  let x = ar.left - wr.left + ar.width / 2 - pr.width / 2;
  if (place.endsWith("start")) x = ar.left - wr.left;
  if (place.endsWith("end")) x = ar.right - wr.left - pr.width;
  let y = place.startsWith("above") ? ar.top - wr.top - pr.height - 8 : ar.bottom - wr.top + 8;
  p.style.left = clamp(x, 8, wr.width - pr.width - 8) + "px";
  p.style.top = clamp(y, 8, wr.height - pr.height - 8) + "px";
  p.addEventListener("click", e => {
    const b = e.target.closest("[data-v]");

}

  if (mod || e.altKey) return;
  const keys = { v: "select", h: "highlight", p: "draw", t: "text", n: "note" };
  const k = e.key.toLowerCase();
  // With vim keys on, the letters belong to vim.
  if (keys[k] && !nw.vim) { if (nw.mode !== "annotate") setMode("annotate"); setTool(keys[k]); }
  if (e.key === "ArrowRight" || e.key === "PageDown") act("pnext");
  if (e.key === "ArrowLeft" || e.key === "PageUp") act("pprev");
});

// The vim keys the app has, as far as the mock needs them: `:` and `/` open the line.
function vimKey(e) {
  if (nw.vimline != null) {
    if (e.key === "Escape") nw.vimline = null;
    else if (e.key === "Backspace") nw.vimline = nw.vimline.length > 1 ? nw.vimline.slice(0, -1) : null;
    else if (e.key === "Enter") {
      const l = nw.vimline, v = l.slice(1).trim(), d = D();
      nw.vimline = null;
      if (l[0] === "/") { $("#n-q").value = v; nwSearch(v); }
      else {
        let i = d.labels.indexOf(v);
        if (i < 0 && /^\d+$/.test(v)) i = +v - 1;
        if (i >= 0 && i < d.labels.length) jump(i); else toast(`Not a command: ${l}`);
      }
    } else if (e.key.length === 1) nw.vimline += e.key;
    else return false;
    nwVim();
    return true;
  }
  if (e.key === ":" || e.key === "/") { nw.vimline = e.key; nwVim(); return true; }
  if (e.key === "j" || e.key === "k") { $("#n-scroll").scrollBy({ top: e.key === "j" ? 80 : -80 }); return true; }
  if (e.key === "n" || e.key === "N") { stepHit(e.key === "n" ? 1 : -1); return true; }
  return false;
}

/* ------------------------------------------------------------------ start */
hydrate($("#cur"));
curInit();
nwInit();
applyProto();
// Both windows start on page i with the selected text box in view, as in the screenshot.
addEventListener("load", schedulePins);
})();
</script>
