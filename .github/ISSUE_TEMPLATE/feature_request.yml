name: Feature request
description: A concrete change you would like in Pagebara
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For an open-ended idea, start on [Discord](https://amazynk.com/discord/). Use this form for a concrete change.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with a PDF, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
