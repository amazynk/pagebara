[package]
name = "pagebara-mobile"
description = "Pagebara for phones and tablets (Android, iOS); runs on desktops for testing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# Android loads the library (`android_main`), built as a cdylib with
# `cargo rustc --lib --crate-type cdylib` (see android/build-apk.sh). iOS and desktop
# hosts run the binary.
[lib]
path = "src/lib.rs"

[[bin]]
name = "pagebara-mobile"
path = "src/main.rs"

[dependencies]
pagebara-app-core.workspace = true
pagebara-i18n.workspace = true
pagebara-optimize.workspace = true
pagebara-conform.workspace = true
pagebara-ui.workspace = true
pagebara-thread.workspace = true
pagebara-syntax.workspace = true
pagebara-pages.workspace = true
pagebara-annot.workspace = true
pagebara-signatures.workspace = true
pagebara-render.workspace = true
# Downloads of other scripts' recognition models, when the user agrees.
pagebara-ocr = { workspace = true, features = ["download"] }
pagebara-content.workspace = true
pagebara-edit.workspace = true
pagebara-stamp.workspace = true
pagebara-flatten.workspace = true
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }
jni = "0.21"
android_logger = { version = "0.15", default-features = false }

# Skia draws with Metal on iOS (OpenGL is not available there).
[target.'cfg(target_os = "ios")'.dependencies]
slint = { workspace = true, features = ["renderer-skia"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint.workspace = true
# Finding elements by accessible label for `--script`; already built as part of Slint.
i-slint-backend-testing = { version = "=1.18.1", default-features = false }
# `--make-samples` for the UI tests.
pagebara-samples.workspace = true
rfd.workspace = true
env_logger.workspace = true

[build-dependencies]
slint-build.workspace = true
pagebara-i18n.workspace = true

# The workspace lints, except that unsafe code is denied rather than forbidden: the code
# Slint generates uses unsafe, and Android's entry point and JNI handles need it (each
# allowed in one documented place).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
